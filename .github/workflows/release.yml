name: Build native release packages

on:
  push:
    tags:
      # Точная проверка формата выполняется в job version. Эти glob-шаблоны ограничивают
      # автоматический запуск тегами, которые начинаются с цифры или с "v" и цифры.
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Numeric package version (for example, 1.2.3)
        required: true
        default: 1.1.1

permissions:
  contents: read

jobs:
  version:
    name: Resolve package version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            raw_version="$GITHUB_REF_NAME"
          else
            raw_version="$MANUAL_VERSION"
          fi
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Package version must contain one to three numeric components: $raw_version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Run test suite
        # JavaFX UI tests need a display. GitHub's Ubuntu image includes Xvfb, so run the whole
        # suite inside a virtual X11 server instead of skipping the end-to-end UI coverage.
        env:
          # The headless runner has no desktop accessibility D-Bus service. Disable only the GTK
          # accessibility bridge in CI to avoid a harmless AT-SPI ServiceUnknown warning.
          NO_AT_BRIDGE: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew test --no-daemon

  linux:
    name: Linux AppImage
    needs: [version, test]
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          # Temurin 24+ publishes JMOD files separately. jpackage needs them to build
          # the compact runtime image requested by -PfullRuntime=false.
          java-package: jdk+jmods
          cache: gradle
      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
      - name: Build AppImage
        run: >-
          ./gradlew appImage --no-daemon
          -PappVersion="$APP_VERSION"
          -PfullRuntime=false
          -PappimagetoolPath="$RUNNER_TEMP/appimagetool.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: database-copier-linux-x86_64
          path: build/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows EXE
    needs: [version, test]
    runs-on: windows-2022
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          java-package: jdk+jmods
          cache: gradle
      - name: Build EXE installer
        shell: pwsh
        run: .\gradlew.bat windowsExe --no-daemon "-PappVersion=$env:APP_VERSION" -PfullRuntime=false
      - uses: actions/upload-artifact@v4
        with:
          name: database-copier-windows-x86_64
          path: build/installer/windows/*.exe
          if-no-files-found: error

  macos:
    name: macOS DMG (Apple Silicon)
    needs: [version, test]
    runs-on: macos-15
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          java-package: jdk+jmods
          cache: gradle
      - name: Build DMG
        run: ./gradlew macDmg --no-daemon -PappVersion="$APP_VERSION" -PfullRuntime=false
      - uses: actions/upload-artifact@v4
        with:
          name: database-copier-macos-arm64
          path: build/installer/macos/*.dmg
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: database-copier-*
          path: release-assets
          merge-multiple: true
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --title "$RELEASE_VERSION"
          --generate-notes
