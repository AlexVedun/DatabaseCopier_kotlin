name: Build native release packages

on:
  push:
    tags:
      # Точная проверка формата выполняется в job version. Эти glob-шаблоны ограничивают
      # автоматический запуск тегами, которые начинаются с цифры или с "v" и цифры.
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag (for example, v1.2.7). Packages are built from the selected branch.
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Resolve package version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate version
        id: version
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$MANUAL_TAG"
          fi
          version="${release_tag#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Release tag must contain one to three numeric components: $release_tag" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --silent; then
              echo "Release tag does not exist: $release_tag" >&2
              exit 1
            fi
            compare_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$release_tag...$GITHUB_SHA" --jq '.status')
            if [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
              echo "Selected branch must contain tag $release_tag (comparison: $compare_status)" >&2
              exit 1
            fi
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Run test suite
        # JavaFX UI tests need a display. GitHub's Ubuntu image includes Xvfb, so run the whole
        # suite inside a virtual X11 server instead of skipping the end-to-end UI coverage.
        env:
          # The headless runner has no desktop accessibility D-Bus service. Disable only the GTK
          # accessibility bridge in CI to avoid a harmless AT-SPI ServiceUnknown warning.
          NO_AT_BRIDGE: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew test --no-daemon

  linux:
    name: Linux AppImage
    needs: [version, test]
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          # Temurin 24+ publishes JMOD files separately. jpackage needs them to build
          # the compact runtime image requested by -PfullRuntime=false.
          java-package: jdk+jmods
          cache: gradle
      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
      - name: Build AppImage
        run: >-
          ./gradlew appImage --no-daemon
          -PappVersion="$APP_VERSION"
          -PfullRuntime=false
          -PappimagetoolPath="$RUNNER_TEMP/appimagetool.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: database-copier-linux-x86_64
          path: build/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows EXE
    needs: [version, test]
    runs-on: windows-2022
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          java-package: jdk+jmods
          cache: gradle
      - name: Build EXE installer
        shell: pwsh
        run: .\gradlew.bat windowsExe --no-daemon "-PappVersion=$env:APP_VERSION" -PfullRuntime=false
      - uses: actions/upload-artifact@v4
        with:
          name: database-copier-windows-x86_64
          path: build/installer/windows/*.exe
          if-no-files-found: error

  macos:
    name: macOS DMG (Apple Silicon)
    needs: [version, test]
    runs-on: macos-15
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          java-package: jdk+jmods
          cache: gradle
      - name: Build DMG
        run: ./gradlew macDmg --no-daemon -PappVersion="$APP_VERSION" -PfullRuntime=false
      - uses: actions/upload-artifact@v4
        with:
          name: database-copier-macos-arm64
          path: build/installer/macos/*.dmg
          if-no-files-found: error

  publish:
    name: Create or update GitHub Release
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: database-copier-*
          path: release-assets
          merge-multiple: true
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          recovery_note="Recovery packages built from commit $GITHUB_SHA. The existing tag remains unchanged."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              existing_notes=$(gh release view "$RELEASE_TAG" --json body --jq '.body')
              if [[ "$existing_notes" == *"$recovery_note"* ]]; then
                gh release edit "$RELEASE_TAG" --draft=false
              else
                gh release edit "$RELEASE_TAG" --draft=false --notes "$recovery_note"$'\n\n'"$existing_notes"
              fi
            else
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            args=(--verify-tag --title "$RELEASE_VERSION" --generate-notes)
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              args+=(--notes "$recovery_note")
            fi
            gh release create "$RELEASE_TAG" release-assets/* "${args[@]}"
          fi
