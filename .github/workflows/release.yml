name: Build native release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Numeric package version (for example, 1.2.3)
        required: true
        default: 1.1.1

permissions:
  contents: read

jobs:
  version:
    name: Resolve package version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          raw_version="${RELEASE_TAG:-$MANUAL_VERSION}"
          version="${raw_version#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Package version must contain one to three numeric components: $raw_version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Run test suite
        run: ./gradlew test --no-daemon

  linux:
    name: Linux AppImage
    needs: [version, test]
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
      - name: Build AppImage
        run: >-
          ./gradlew appImage --no-daemon
          -PappVersion="$APP_VERSION"
          -PfullRuntime=false
          -PappimagetoolPath="$RUNNER_TEMP/appimagetool.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: database-copier-linux-x86_64
          path: build/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows EXE
    needs: [version, test]
    runs-on: windows-2022
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build EXE installer
        shell: pwsh
        run: .\gradlew.bat windowsExe --no-daemon "-PappVersion=$env:APP_VERSION" -PfullRuntime=false
      - uses: actions/upload-artifact@v4
        with:
          name: database-copier-windows-x86_64
          path: build/installer/windows/*.exe
          if-no-files-found: error

  macos:
    name: macOS DMG (Intel)
    needs: [version, test]
    runs-on: macos-15-intel
    env:
      APP_VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build DMG
        run: ./gradlew macDmg --no-daemon -PappVersion="$APP_VERSION" -PfullRuntime=false
      - uses: actions/upload-artifact@v4
        with:
          name: database-copier-macos-x86_64
          path: build/installer/macos/*.dmg
          if-no-files-found: error

  publish:
    name: Attach packages to GitHub Release
    if: github.event_name == 'release'
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: database-copier-*
          path: release-assets
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
