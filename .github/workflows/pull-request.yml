name: Pull request tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Run test suite
        env:
          NO_AT_BRIDGE: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew test --no-daemon
